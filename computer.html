<!DOCTYPE html>
<html lang="en">
<head>
<meta http-equiv="Cache-Control" content="no-cache">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LIFT – strength training for beginners</title>
<link rel="icon" href="icons/icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<script>if(!matchMedia('(min-width: 760px)').matches) location.replace('index.html?app');</script>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:radial-gradient(1200px 600px at 70% 20%,#12301e 0%,#0b0d0c 55%) fixed;color:#eef3f0;font-family:Inter,system-ui,sans-serif;display:flex;align-items:center;justify-content:center;overflow:hidden;height:100vh;padding:0}
.phone{width:390px;height:844px;border-radius:58px;padding:14px;background:#050605;box-shadow:0 0 0 2px #2a322e,0 0 0 9px #111513,0 40px 100px rgba(0,0,0,.7),0 0 80px rgba(57,255,122,.12);position:relative;flex:none;transform-origin:center center}
.phone:before{content:"";position:absolute;top:24px;left:50%;transform:translateX(-50%);width:120px;height:34px;background:#000;border-radius:20px;z-index:2}
.phone iframe{width:100%;height:100%;border:0;border-radius:44px;background:#0b0d0c}
</style>
</head>
<body>
<div class="phone" id="phone"><iframe src="index.html?app" title="LIFT app"></iframe></div>
<script>
// Telefonen fylder så meget af skærmhøjden som muligt
function fit(){ var s = Math.min((innerHeight - 24) / 872, (innerWidth - 24) / 418); document.getElementById('phone').style.transform = 'scale(' + s + ')' }
addEventListener('resize', fit); fit();
</script>
</body>
</html>
